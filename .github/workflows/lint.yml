name: Lint Docs

# 散文质量闸门：给「写作」也建一个「信任但要验证」的闭环。
# 不做 paths 过滤：全量跑也就 3–4 分钟，且「散文质量」将设为 required check——
# 带过滤时只动过滤外文件的 PR 检查不触发、required 状态永远 pending、PR 无法合并。
on:
  pull_request:
  push:
    branches: [main]

# 供应链纪律：token 一律只读；第三方 action 只引用不可变版本（活分支引用是 2026-07 评审点名的风险）。
permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: 散文质量
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: autocorrect（中英文混排空格 / 标点）
        uses: huacnlee/autocorrect-action@v2.13.3

      - name: Vale（套话 / AI 腔）
        # 直接运行同版本 CLI，避免 reviewdog 读取超过 300 文件的 PR diff 时失败。
        # 保留安装依赖前的全仓库扫描和错误退出，不依赖 PR 注释接口。
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/vale-cli/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz \
            --output "$RUNNER_TEMP/aiwiki-vale.tar.gz"
          echo "fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0  $RUNNER_TEMP/aiwiki-vale.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/aiwiki-vale.tar.gz" --directory "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" --version
          "$RUNNER_TEMP/vale" .

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: cspell（拼写；devDependencies 锁定版本，别再全局浮动装）
        run: npx cspell --no-progress "docs/**/*.{md,mdx}" "privacy/**/*.{md,mdx}" "i18n/**/*.{md,mdx}"

      - name: i18n（侧边栏分类翻译完整性，防回退成中文）
        run: npm run check:i18n

      - name: 中英镜像完整性（每条 docs 都要有 i18n/en 对应）
        run: npm run check:mirror

      - name: 镜像结构对等（标题 / admonition / 内链目标集 / slug，防中改英不改）
        run: npm run check:mirror-deep

      - name: 手写计数一致性（core-20 / CLAUDE.md 现状 vs 实际条目数）
        run: npm run check:counts

      - name: 内容交付（真实索引、双语摘要/来源/元数据、机制索引覆盖）
        run: npm run check:content

      - name: MCP 回归（含真实内容索引与跨主题取文）
        run: npm run test:mcp

      - name: 构建（两 locale；连带校验 MDX / import / 死内链）
        run: npm run build
